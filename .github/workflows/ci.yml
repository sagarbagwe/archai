name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Validate frontend
        run: |
          set -o pipefail
          { npm run lint && npm test && npm run build; } 2>&1 | tee ../frontend-ci.log
      - name: Report frontend failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.existsSync('frontend-ci.log') ? fs.readFileSync('frontend-ci.log','utf8').slice(-12000) : 'No frontend log was produced.';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## Frontend CI failure\n\n\`\`\`text\n${text}\n\`\`\``});

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate backend
        run: |
          set -o pipefail
          mvn -B verify 2>&1 | tee ../backend-ci.log
      - name: Report backend failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.existsSync('backend-ci.log') ? fs.readFileSync('backend-ci.log','utf8').slice(-12000) : 'No backend log was produced.';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## Backend CI failure\n\n\`\`\`text\n${text}\n\`\`\``});

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
